<!DOCTYPE html>

<html>

<head>
  <title>Rock-paper-scissor.com</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Rock-Paper-Scissors game</h1>
  <h2>Tap Any move below to play</h2>
  <div class="moves-container">
    <button  id="rock" class="move-icon">
    <img src="images/rock.png" alt="">
  </button>
  <button id="paper" class="move-icon">
    <img src="images/paper.png" alt="">
  </button>
  <button id="scissors" class="move-icon">
    <img src="images/scissors.png" alt="">
  </button>

  </div>
  
  <p class="result-js"></p>
  <p class="move-js"></p>
  <p id="score" class="score-js"></p>
  
  <button class="resetScore" id="reset">
    <img src="images/reset.png" alt="">
  </button>
</body>

</html>
